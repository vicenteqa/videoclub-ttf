name: Comprobar

# Cada push, a cualquier rama: pasa los tests y compila. No publica nada — eso es publish.yml, y se
# lanza a mano. Esto es lo que dice "compila y los tests pasan" antes de que un APK se acerque a un
# salón, ahora que el portátil donde se programa no tiene por qué tener SDK de Android.
#
# Sin local.properties a propósito: sin casas no hay flavours (ver app/build.gradle.kts), así que
# `testDebugUnitTest` y `assembleRelease` existen tal cual, y el release firma con la clave de debug.
# Ni keystore ni contraseña del panel hacen falta para saber si el código compila.
on:
  push:
    paths-ignore:
      - "**/*.md"
      - "server/**"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: comprobar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  comprobar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: SDK de Android
        uses: android-actions/setup-android@v3

      - name: Clave del VPS
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ vars.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Descodificador FFmpeg
        # El mismo .aar que usa publish.yml: sin él app/build.gradle.kts se niega a configurar.
        run: |
          mkdir -p app/libs
          scp "${{ vars.VPS_SSH }}:/var/lib/simpletv-admin/build-assets/media3-decoder-ffmpeg.aar" app/libs/

      - name: Tests y compilación
        run: ./gradlew --no-daemon testDebugUnitTest assembleRelease

      - name: Informe de tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: informe-tests
          path: app/build/reports/tests/
          if-no-files-found: ignore
