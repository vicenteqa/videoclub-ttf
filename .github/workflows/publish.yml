name: Publicar Videoclub

# A mano, nunca en un push. Compila el release de las casas pedidas y lo publica en el VPS
# exactamente como lo haría ./publish.sh, casa por casa.
#
# Antes esto saltaba con cada push a main y publicaba en las seis casas a la vez, que es justo lo que
# DEPLOYMENT.md dice que no se haga: Android no deja volver a un versionCode anterior, así que
# escalonar es la única vuelta atrás que hay. Ahora se elige: primero una casa (la propia), se deja un
# día, y luego el resto.
#
#   gh workflow run publish.yml -f casas=vicente
#   gh workflow run publish.yml -f casas="papa manel"
#   gh workflow run publish.yml -f casas=todas          (sólo desde main)
#
# Desde otra rama se puede publicar en casas sueltas — para probar una rama en la tele propia antes de
# mezclarla —, pero "todas" sólo sale de main: lo que llega a todos los salones tiene que estar en main.
on:
  workflow_dispatch:
    inputs:
      casas:
        description: "Casas separadas por espacios, o «todas» (sólo desde main). Primero una; el resto al día siguiente."
        required: true
        default: vicente

permissions:
  contents: read

# Dos publicaciones a la vez se pisarían en el mismo directorio del VPS y en /liberar.
concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: SDK de Android
        uses: android-actions/setup-android@v3

      - name: Clave del VPS
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ vars.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Descodificador FFmpeg
        # Precompilado una vez y guardado en el VPS (ver build-ffmpeg-decoder.sh): reconstruirlo en
        # cada build tarda muy largo y necesita NDK — sólo hace falta volver a subirlo ahí el día
        # que cambie la versión de media3 en gradle/libs.versions.toml.
        run: |
          mkdir -p app/libs
          scp "${{ vars.VPS_SSH }}:/var/lib/simpletv-admin/build-assets/media3-decoder-ffmpeg.aar" app/libs/

      - name: Tests
        # Antes de escribir local.properties, a propósito: sin casas no hay flavours y
        # `testDebugUnitTest` corre una vez, no una por casa. Un test roto no llega a compilar ningún
        # APK, y mucho menos a subirlo.
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Keystore de release
        run: |
          mkdir -p keystore
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > keystore/videoclub-release.p12

      - name: local.properties
        run: |
          cat > local.properties <<EOF
          sdk.dir=$ANDROID_HOME
          keystore.path=keystore/videoclub-release.p12
          keystore.alias=videoclub
          keystore.password=${{ secrets.KEYSTORE_PASSWORD }}
          panel.url=${{ secrets.PANEL_URL }}
          panel.user=${{ secrets.PANEL_USER }}
          panel.password=${{ secrets.PANEL_PASSWORD }}
          vps.ssh=${{ vars.VPS_SSH }}
          EOF

      - name: Casas (desde el panel)
        run: ./sync-casas.sh

      - name: Publicar
        # La entrada llega por entorno y no interpolada en el guion: lo que se escribe en ese campo no
        # debe poder convertirse en bash.
        env:
          PEDIDAS: ${{ inputs.casas }}
        run: |
          set -euo pipefail
          conocidas=$(sed -n 's/^casa\.\([A-Za-z0-9-]*\)\.remoteConfig\.url=.*/\1/p' local.properties)
          [[ -n "$conocidas" ]] || { echo "El panel no devolvió ninguna casa de Videoclub."; exit 1; }

          read -ra pedidas <<< "$PEDIDAS"
          [[ ${#pedidas[@]} -gt 0 ]] || { echo "No se ha pedido ninguna casa."; exit 1; }

          if [[ "${pedidas[*]}" == "todas" ]]; then
            [[ "$GITHUB_REF" == "refs/heads/main" ]] || {
              echo "«todas» sólo se publica desde main (esto es $GITHUB_REF). Desde una rama, casas sueltas."
              exit 1
            }
            casas=$conocidas
          else
            # Todas comprobadas antes de compilar la primera: un nombre mal escrito al final de la
            # lista no debe dejar la mitad publicada.
            for casa in "${pedidas[@]}"; do
              grep -qx -- "$casa" <<< "$conocidas" || {
                echo "No hay ninguna casa '$casa'. Hay:"; printf '  %s\n' $conocidas; exit 1
              }
            done
            casas="${pedidas[*]}"
          fi

          for casa in $casas; do
            echo "::group::$casa"
            ./publish.sh --casa "$casa"
            echo "::endgroup::"
          done
