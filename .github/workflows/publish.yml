name: Publicar Videoclub

# A mano, nunca en un push. Compila el release de las casas pedidas y lo publica en el VPS
# exactamente como lo haría ./publish.sh, casa por casa.
#
# Antes esto saltaba con cada push a main y publicaba en las seis casas a la vez, que es justo lo que
# DEPLOYMENT.md dice que no se haga: Android no deja volver a un versionCode anterior, así que
# escalonar es la única vuelta atrás que hay. Ahora se elige: primero una casa (la propia), se deja un
# día, y luego el resto.
#
#   gh workflow run publish.yml -f casas=vicente
#   gh workflow run publish.yml -f casas="papa manel"
#   gh workflow run publish.yml -f casas=todas          (sólo desde main)
#
# Desde otra rama se puede publicar en casas sueltas — para probar una rama en la tele propia antes de
# mezclarla —, pero "todas" sólo sale de main: lo que llega a todos los salones tiene que estar en main.
on:
  workflow_dispatch:
    inputs:
      casas:
        description: "Casas separadas por espacios, o «todas» (sólo desde main). Primero una; el resto al día siguiente."
        required: true
        default: vicente

permissions:
  contents: read

# Dos publicaciones a la vez se pisarían en el mismo directorio del VPS y en /liberar.
concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: SDK de Android
        # De terceros: fijada a un commit y no a una etiqueta, que su dueño puede mover a otro
        # código cuando quiera. Esta es la v3.2.2, la misma que daba `@v3`.
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          # Sin `tools`: ver ci.yml.
          packages: platform-tools

      - name: Clave del VPS
        # Secretos y variables por entorno, nunca pegados en el guion: `${{ }}` se sustituye antes de
        # que bash lo lea, así que una comilla dentro de la clave rompería el comando.
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ vars.VPS_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Descodificador FFmpeg
        # Precompilado una vez y guardado en el VPS (ver build-ffmpeg-decoder.sh): reconstruirlo en
        # cada build tarda muy largo y necesita NDK — sólo hace falta volver a subirlo ahí el día
        # que cambie la versión de media3 en gradle/libs.versions.toml.
        env:
          VPS_SSH: ${{ vars.VPS_SSH }}
        run: |
          mkdir -p app/libs
          scp "$VPS_SSH:/var/lib/simpletv-admin/build-assets/media3-decoder-ffmpeg.aar" app/libs/

      - name: Tests
        # Con el flavour `general` (ver ci.yml), antes de traer ninguna casa: así corren una vez y no una
        # por flavour. Un test roto no llega a compilar ningún APK, y mucho menos a subirlo.
        run: ./gradlew --no-daemon testGeneralDebugUnitTest

      - name: Keystore de release
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p keystore
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > keystore/videoclub-release.p12

      - name: local.properties
        # Por entorno también. Pegadas en el heredoc, bash expandía lo que hubiera dentro: una
        # contraseña con un `$` o una comilla invertida llegaba a Gradle cambiada, o ejecutaba algo.
        # Las variables se expanden una sola vez y su contenido ya no se vuelve a leer.
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          PANEL_URL: ${{ secrets.PANEL_URL }}
          PANEL_USER: ${{ secrets.PANEL_USER }}
          PANEL_PASSWORD: ${{ secrets.PANEL_PASSWORD }}
          VPS_SSH: ${{ vars.VPS_SSH }}
        run: |
          cat > local.properties <<EOF
          sdk.dir=$ANDROID_HOME
          keystore.path=keystore/videoclub-release.p12
          keystore.alias=videoclub
          keystore.password=$KEYSTORE_PASSWORD
          panel.url=$PANEL_URL
          panel.user=$PANEL_USER
          panel.password=$PANEL_PASSWORD
          vps.ssh=$VPS_SSH
          EOF

      - name: Casas (desde el panel)
        run: ./sync-casas.sh

      - name: Publicar
        # La entrada llega por entorno y no interpolada en el guion: lo que se escribe en ese campo no
        # debe poder convertirse en bash.
        env:
          PEDIDAS: ${{ inputs.casas }}
        # Las casas se comprueban en publish.sh, contra el panel y todas antes de compilar: aquí ya no
        # hay lista con la que compararlas, porque local.properties sólo lleva las simples.
        run: |
          set -euo pipefail
          read -ra pedidas <<< "$PEDIDAS"
          [[ ${#pedidas[@]} -gt 0 ]] || { echo "No se ha pedido ninguna casa."; exit 1; }

          if [[ "${pedidas[*]}" == "todas" ]]; then
            [[ "$GITHUB_REF" == "refs/heads/main" ]] || {
              echo "«todas» sólo se publica desde main (esto es $GITHUB_REF). Desde una rama, casas sueltas."
              exit 1
            }
            ./publish.sh --todas
          else
            args=()
            for casa in "${pedidas[@]}"; do args+=(--casa "$casa"); done
            ./publish.sh "${args[@]}"
          fi
